name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - name: Shell syntax
        run: |
          for path in tools/build_rootfs.sh usb/init-bootstrap usb/init-rootfs usb/w152d-firstboot wifi/w152d-* src/status_service.sh; do
            sh -n "$path"
          done
