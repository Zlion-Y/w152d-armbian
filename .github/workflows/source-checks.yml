name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - name: Shell syntax
        run: |
          bash -n tools/build_mainline_artifacts.sh
          bash -n tools/build_w152d_kernel.sh
          bash -n gpu-hdmi-driver/gcc-wrap.sh
          bash -n gpu-hdmi-driver/install.sh
          for path in tools/build_rootfs.sh usb/init-rootfs usb/w152d-firstboot usb/w152d-leds usb/w152d-grow-rootfs usb/mainline/init usb/mainline/w152d_usb_root wifi/w152d-* src/status_service.sh; do
            sh -n "$path"
          done
